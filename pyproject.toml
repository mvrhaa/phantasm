[project]
name = "zero"
version = "0.1.0"
description = "Local brain of an AI companion for macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
zero = "zero.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # modern Python syntax
    "B",    # likely bugs
    "T20",  # no print(), the spec requires logging
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]  # command-line helpers talk to the user with print()

[tool.ruff.format]
exclude = ["*.md"]  # do not reformat code samples in the markdown docs
